backend:
  name: git-gateway
  branch: main

media_folder: "assets/products"
public_folder: "/assets/products"

site_url: https://ozelboutiquebh.netlify.app
display_url: https://ozelboutiquebh.netlify.app

collections:
  - name: "categories"
    label: "Categories"
    files:
      - name: "list"
        label: "Categories"
        file: "data/categories.json"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{label_en}}"
            hint: "Add, rename, reorder, or remove shop categories here. Note: to assign PRODUCTS to a brand-new category you add here, that category's key also needs to be added once to the Category dropdown in the Products section below — ask your developer for that one small update."
            fields:
              - { label: "Key (lowercase, no spaces, e.g. shirts)", name: "key", widget: "string" }
              - { label: "Name (English)", name: "label_en", widget: "string" }
              - { label: "Name (Arabic)", name: "label_ar", widget: "string" }
              - { label: "Thumbnail image (used on homepage tile, optional)", name: "image", widget: "image", required: false }
              - { label: "Show in main navigation menu", name: "show_in_nav", widget: "boolean", default: true }

  - name: "products"
    label: "Products"
    files:
      - name: "catalog"
        label: "Product Catalog"
        file: "data/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{name_en}} ({{category}})"
            fields:
              - { label: "ID (unique, no spaces)", name: "id", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                hint: "This list is fixed in code. If you added a new category above, it won't appear here until that's added too."
                options: ["shirts", "tshirts", "pants", "accessories"]
              - { label: "Price (BD)", name: "price", widget: "number", value_type: "float" }
              - { label: "Name (English)", name: "name_en", widget: "string" }
              - { label: "Name (Arabic)", name: "name_ar", widget: "string" }
              - { label: "Fabric description (English)", name: "fabric_en", widget: "text" }
              - { label: "Fabric description (Arabic)", name: "fabric_ar", widget: "text" }
              - { label: "Care instructions (English)", name: "care_en", widget: "text" }
              - { label: "Care instructions (Arabic)", name: "care_ar", widget: "text" }
              - label: "Colors / Variants"
                name: "variants"
                widget: "list"
                summary: "{{color_en}}"
                fields:
                  - { label: "Color name (English)", name: "color_en", widget: "string" }
                  - { label: "Color name (Arabic)", name: "color_ar", widget: "string" }
                  - { label: "Swatch color (hex)", name: "swatch", widget: "color" }
                  - { label: "Photo", name: "image", widget: "image" }
                  - label: "Stock by size"
                    name: "stock"
                    widget: "object"
                    fields:
                      - { label: "S in stock", name: "S", widget: "boolean", default: true }
                      - { label: "M in stock", name: "M", widget: "boolean", default: true }
                      - { label: "L in stock", name: "L", widget: "boolean", default: true }
                      - { label: "XL in stock", name: "XL", widget: "boolean", default: true }
                      - { label: "XXL in stock", name: "XXL", widget: "boolean", default: true }

  - name: "size_guide"
    label: "Size Guide"
    files:
      - name: "guide"
        label: "Size Guide"
        file: "data/size-guide.json"
        fields:
          - { label: "Note (English)", name: "note_en", widget: "text" }
          - { label: "Note (Arabic)", name: "note_ar", widget: "text" }
          - label: "Size rows"
            name: "rows"
            widget: "list"
            summary: "{{size}}"
            fields:
              - { label: "Size", name: "size", widget: "string" }
              - { label: "Chest / Waist (cm)", name: "chest_waist", widget: "string" }
              - { label: "Length (cm)", name: "length", widget: "string" }
